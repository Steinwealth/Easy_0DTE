# Easy ORB Strategy — build + post-deploy GCR cleanup (all active image repos)
# Usage: gcloud builds submit --config cloudbuild.yaml .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build-trading
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/easy-etrade-strategy:latest', '.']

  - name: 'gcr.io/cloud-builders/gcloud'
    id: gcr-image-cleanup
    entrypoint: bash
    args: ['scripts/cloudbuild_image_cleanup.sh']
    waitFor: ['build-trading']

images:
  - 'gcr.io/$PROJECT_ID/easy-etrade-strategy:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
