# Easy ORB Strategy — config manifest & ownership (Config Cleanup Pass 4 — Jun 2026)
# Loader order (later overrides earlier): Data → Shared → ORBSO → Account0DTE → ORB0DTE → Trendline0DTE → Risk → Alerts
# Classifications on ownership_groups: KEEP_PUBLIC | MERGE_INTO_PROFILE | MOVE_TO_CODE_DEFAULT | DEPRECATE | UNKNOWN_USAGE_NEEDS_CODE_SEARCH
# Prefix / exact matching: exact_keys win first; then longest key_prefix wins (see modules/config_surface_metrics.py).

version: 2
loader_order:
  - Data.env
  - Shared.env
  - ORBSO.env
  - Account0DTE.env
  - ORB0DTE.env
  - Trendline0DTE.env
  - Risk.env
  - Alerts.env

profile_keys:
  SO_PROFILE: { owner: ORB_SO, default: balanced, allowed: [conservative, balanced, aggressive_open, momentum_open] }
  ORB_0DTE_EXECUTION_PROFILE: { owner: ORB_0DTE, default: balanced_open, allowed: [conservative, balanced_open, aggressive_open, momentum_open] }
  TRENDLINE_ENTRY_PROFILE: { owner: TRENDLINE_0DTE, default: balanced, allowed: [conservative, balanced, aggressive_open, momentum_breakout, retest_friendly] }
  OPTIONS_EXIT_PROFILE: { owner: OPTIONS_EXIT, default: balanced, allowed: [conservative, balanced, aggressive_capture, runner_capture] }

# Keys still allowed to appear in multiple files with identical merged effect (post Pass 3 cleanup).
cross_file_duplicate_policy:
  resolved_no_warning_keys: []

deprecated_aliases:
  - canonical: ORB_0DTE_OVEREXTENSION_SOFT_THRESHOLD
    legacy: 0DTE_EXTENSION_THRESHOLD_PCT
    resolution: canonical_wins_if_both_set
  - canonical: OPTION_SINGLE_NO_PROGRESS_MINUTES
    legacy: OPTION_STEALTH_ORB_OPENING_NO_PROGRESS_MINUTES
    resolution: canonical_wins_if_both_set
  - canonical: OPTION_SINGLE_FAVORABLE_PRICE_PCT
    legacy: OPTION_STEALTH_NO_PROGRESS_FAVORABLE_UNDERLYING_MOVE_PCT
    resolution: canonical_wins_if_both_set
  - canonical: OPTION_SINGLE_EXIT_GRADE_BYPASS
    legacy: ORB_OPTIONS_SAFETY_EXIT_BYPASS_EXIT_GRADE
    resolution: canonical_wins_if_both_set
  - canonical: OPTION_SINGLE_MFE_TRAIL_TRIGGER
    legacy: OPTION_STEALTH_ORB_MFE_TRIGGER_PCT
    resolution: canonical_wins_if_both_set
  - canonical: OPTION_SINGLE_MFE_TRAIL_EXIT
    legacy: OPTION_STEALTH_ORB_MFE_DRAWDOWN_EXIT_PCT
    resolution: canonical_wins_if_both_set
  - canonical: ENABLE_TRENDLINE_STRATEGY
    legacy: TRENDLINE_ENABLED
    resolution: canonical_wins_if_both_set
  - canonical: TRENDLINE_SIMPLE_INDEX_MIN_VOLUME_RATIO
    legacy: TRENDLINE_SIMPLE_INDEX_PUT_MIN_VOLUME_RATIO
    resolution: canonical_wins_if_both_set
  - canonical: ALERT_COOLDOWN_SECONDS
    legacy: TELEGRAM_ALERT_COOLDOWN_SECONDS
    resolution: canonical_wins_if_both_set
  - canonical: ALERT_COOLDOWN_SECONDS
    legacy: ALERT_COOLDOWN_MINUTES
    resolution: canonical_wins_if_both_set
  - canonical: 0DTE_MAX_BID_ASK_SPREAD_PCT
    legacy: 0DTE_OPTIONS_MAX_BID_ASK_SPREAD_PCT
    resolution: legacy_used_if_set_else_canonical
  - canonical: LIVE_MAX_SPREAD_PCT
    legacy: LIVE_MAX_SPREAD_PCT
    resolution: deprecated_use_path_owned_caps
    note: ORB→0DTE_SINGLE_LEG_DIRECTIONAL_MAX_SPREAD_PCT · Trendline→TRENDLINE_OPTION_MAX_SPREAD_PCT

